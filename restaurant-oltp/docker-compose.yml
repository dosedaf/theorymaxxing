services:
  postgres:
    image: postgres:17-alpine
    container_name: restaurant-oltp-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-restaurant}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-restaurant}
      POSTGRES_DB: ${POSTGRES_DB:-restaurant}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - restaurant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-restaurant} -d ${POSTGRES_DB:-restaurant}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  restaurant_pgdata:
